version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5442:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - /root/tag-master/postgres_data:/var/lib/postgresql/data

  databasus:
    container_name: tag-master-databasus
    image: databasus/databasus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:4005:4005"
    volumes:
      - /root/tag-master/databasus-data:/databasus-data
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "databasus", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
